# AuditOS backend — tooling config (deps live in requirements*.txt per SPEC §4 style)
[project]
name = "auditos-engine"
version = "0.1.0"
description = "AuditOS — AI smart-contract security engine (backend)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# The slow-moving core (P7) is held to strict typing; the fast edge is looser.
strict = true
[[tool.mypy.overrides]]
module = ["engine.agents.*"]
disallow_untyped_defs = false
